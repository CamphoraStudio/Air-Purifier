# Minimalist firmware for testing fan resonance offsets.

esphome:
  on_boot:
    priority: -100.0 # Run after components are set up
    then:
      - lambda: |-
          id(fan_test_status).publish_state("Idle");
          id(final_target_speed).publish_state(0.0);

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf


switch:
  - platform: gpio
    pin: GPIO18
    id: enable_12v
    name: "12V Rail"
    internal: true
    restore_mode: ALWAYS_ON

globals:
  - id: current_fan_offset
    type: float
    initial_value: '0.0f'

# --- Home Assistant Interface ---
button:
  - platform: template
    name: "Start Fan Test"
    icon: "mdi:play-circle"
    on_press:
      - script.execute: run_fan_test

text_sensor:
  - platform: template
    name: "Fan Test Status"
    id: fan_test_status
    icon: "mdi:clipboard-text-clock"

sensor:
  # Final fan speed target.
  - platform: template
    name: "Final Target Speed"
    id: final_target_speed
    unit_of_measurement: "%"
    icon: "mdi:fan-chevron-up"
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            float target_speed_level = x / 100.0f;
            
            if (target_speed_level == 0.0f) {
              id(pwm_fan_1).set_level(0.0f);
              id(pwm_fan_2).set_level(0.0f);
              id(pwm_fan_3).set_level(0.0f);
              id(pwm_fan_4).set_level(0.0f);
              id(pwm_fan_5).set_level(0.0f);
            } else {
              auto calculate_pwm = [&](float speed) {
                return 0.1f + (speed * 0.9f);
              };
              
              float offset = id(current_fan_offset);

              float fan_1_target = target_speed_level;
              float fan_2_target = clamp(target_speed_level - (1 * offset), 0.0f, 1.0f);
              float fan_3_target = clamp(target_speed_level - (2 * offset), 0.0f, 1.0f);
              float fan_4_target = clamp(target_speed_level - (3 * offset), 0.0f, 1.0f);
              float fan_5_target = clamp(target_speed_level - (4 * offset), 0.0f, 1.0f);

              id(pwm_fan_1).set_level(calculate_pwm(fan_1_target));
              id(pwm_fan_2).set_level(calculate_pwm(fan_2_target));
              id(pwm_fan_3).set_level(calculate_pwm(fan_3_target));
              id(pwm_fan_4).set_level(calculate_pwm(fan_4_target));
              id(pwm_fan_5).set_level(calculate_pwm(fan_5_target));
            }

  # Tachometer Sensor for reading fan RPM.
  - platform: pulse_counter
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
    name: "Fan RPM"
    id: fan_rpm
    update_interval: 2s
    filters:
      - multiply: 0.5 # 2 pulses per revolution
    unit_of_measurement: "RPM"
    icon: "mdi:fan-clock"
    accuracy_decimals: 0

# --- Fan PWM Outputs ---
output:
  - platform: ledc
    pin: GPIO3
    id: pwm_fan_1
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO4
    id: pwm_fan_2
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO5
    id: pwm_fan_3
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO6
    id: pwm_fan_4
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO7
    id: pwm_fan_5
    frequency: 25000 Hz

# --- Core Test Logic ---
# --- Core Test Logic ---
script:
  # Main test sequence script, triggered by the HA button
  - id: run_fan_test
    mode: restart # Allows re-pressing the button to restart the test
    then:
      # 1. Initial 5-second countdown (fans OFF)
      - lambda: |-
          id(final_target_speed).publish_state(0.0);
          id(fan_test_status).publish_state("Test Starting...");
      - delay: 5s

      # --- 2. Test at 100% Speed ---

      # STEP: 100% | 0.0%
      - lambda: |-
          id(current_fan_offset) = 0.0f;
          id(fan_test_status).publish_state("100% | 0.0%");
          id(final_target_speed).publish_state(100.0);
      - delay: 10s

      # STEP: 100% | 1.0%
      - lambda: |-
          id(current_fan_offset) = 0.01f;
          id(fan_test_status).publish_state("100% | 1.0%");
          id(final_target_speed).publish_state(100.0);
      - delay: 10s

      # STEP: 100% | 2.2%
      - lambda: |-
          id(current_fan_offset) = 0.022f;
          id(fan_test_status).publish_state("100% | 2.2%");
          id(final_target_speed).publish_state(100.0);
      - delay: 10s

      # STEP: 100% | 4.7%
      - lambda: |-
          id(current_fan_offset) = 0.047f;
          id(fan_test_status).publish_state("100% | 4.7%");
          id(final_target_speed).publish_state(100.0);
      - delay: 10s

      # --- 3. Test at 50% Speed ---

      # STEP: 50% | 0.0%
      - lambda: |-
          id(current_fan_offset) = 0.0f;
          id(fan_test_status).publish_state("50% | 0.0%");
          id(final_target_speed).publish_state(50.0);
      - delay: 10s

      # STEP: 50% | 1.0%
      - lambda: |-
          id(current_fan_offset) = 0.01f;
          id(fan_test_status).publish_state("50% | 1.0%");
          id(final_target_speed).publish_state(50.0);
      - delay: 10s

      # STEP: 50% | 2.2%
      - lambda: |-
          id(current_fan_offset) = 0.022f;
          id(fan_test_status).publish_state("50% | 2.2%");
          id(final_target_speed).publish_state(50.0);
      - delay: 10s

      # STEP: 50% | 4.7%
      - lambda: |-
          id(current_fan_offset) = 0.047f;
          id(fan_test_status).publish_state("50% | 4.7%");
          id(final_target_speed).publish_state(50.0);
      - delay: 10s

      # --- 4. Test Complete - Shut down ---
      - lambda: |-
          id(final_target_speed).publish_state(0.0);
          id(current_fan_offset) = 0.0f;
          id(fan_test_status).publish_state("Idle");