# Minimalist firmware for testing fan resonance offsets.

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

switch:
  - platform: gpio
    pin: GPIO18
    id: enable_12v
    name: "12V Rail"
    internal: true
    restore_mode: ALWAYS_ON

globals:
  # This global will be updated by the test script
  - id: current_fan_offset
    type: float
    initial_value: '0.0f'

button:
  - platform: template
    name: "Start Fan Test"
    icon: "mdi:play-circle"
    on_press:
      - script.execute: run_fan_test

text_sensor:
  - platform: template
    name: "Fan Test Status"
    id: fan_test_status
    icon: "mdi:clipboard-text-clock"
    initial_value: "Idle"

sensor:
  # Exposed to HA for the final, authoritative fan speed target.
  # The test script will publish states to this sensor.
  - platform: template
    name: "Final Target Speed"
    id: final_target_speed
    unit_of_measurement: "%"
    icon: "mdi:fan-chevron-up"
    accuracy_decimals: 1
    initial_value: 0.0 # Fans are OFF by default
    on_value:
      then:
        - lambda: |-
            // Translate the final target speed (0-100%) into the five staggered PWM signals.
            // This now reads the offset from the global 'current_fan_offset'.
            float target_speed_level = x / 100.0f;
            
            if (target_speed_level == 0.0f) {
              id(pwm_fan_1).set_level(0.0f);
              id(pwm_fan_2).set_level(0.0f);
              id(pwm_fan_3).set_level(0.0f);
              id(pwm_fan_4).set_level(0.0f);
              id(pwm_fan_5).set_level(0.0f);
            } else {
              auto calculate_pwm = [&](float speed) {
                return 0.1f + (speed * 0.9f);
              };
              
              // Read the offset from the global variable
              float offset = id(current_fan_offset);

              float fan_1_target = target_speed_level;
              float fan_2_target = clamp(target_speed_level - (1 * offset), 0.0f, 1.0f);
              float fan_3_target = clamp(target_speed_level - (2 * offset), 0.0f, 1.0f);
              float fan_4_target = clamp(target_speed_level - (3 * offset), 0.0f, 1.0f);
              float fan_5_target = clamp(target_speed_level - (4 * offset), 0.0f, 1.0f);

              id(pwm_fan_1).set_level(calculate_pwm(fan_1_target));
              id(pwm_fan_2).set_level(calculate_pwm(fan_2_target));
              id(pwm_fan_3).set_level(calculate_pwm(fan_3_target));
              id(pwm_fan_4).set_level(calculate_pwm(fan_4_target));
              id(pwm_fan_5).set_level(calculate_pwm(fan_5_target));
            }

  # Tachometer Sensor for reading fan RPM. This is still active.
  - platform: pulse_counter
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
    name: "Fan RPM"
    id: fan_rpm
    update_interval: 2s
    filters:
      - multiply: 0.5 # Convert Pulses/Min to Revolutions/Min (2 pulses per revolution)
    unit_of_measurement: "RPM"
    icon: "mdi:fan-clock"
    accuracy_decimals: 0

# --- Fan PWM Outputs ---
output:
  - platform: ledc
    pin: GPIO3
    id: pwm_fan_1
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO4
    id: pwm_fan_2
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO5
    id: pwm_fan_3
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO6
    id: pwm_fan_4
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO7
    id: pwm_fan_5
    frequency: 25000 Hz

# --- Core Test Logic ---
script:
  # Helper script to test one specific speed/offset combination
  - id: _run_test_step
    mode: single
    # Parameters to pass to the script
    parameters:
      speed_percent: float
      offset_float: float
      offset_text: string
    then:
      - logger.log: !lambda
          return (std::string("Testing ") + std::to_string((int)speed_percent) + "% speed, " + offset_text + " offset...").c_str();
      # 1. Set the global offset variable
      - lambda:
          id(current_fan_offset) = offset_float;
      # 2. Update the status text sensor in HA
      - id(fan_test_status).publish_state(
          !lambda
            return (std::to_string((int)speed_percent) + "% | " + offset_text).c_str();
        );
      # 3. Set the target speed (this triggers the on_value lambda)
      - id(final_target_speed).publish_state(speed_percent);
      # 4. Wait 10 seconds
      - delay: 10s

  # Main test sequence script, triggered by the HA button
  - id: run_fan_test
    mode: restart # Allows re-pressing the button to restart the test
    then:
      # 1. Initial 5-second countdown (fans OFF)
      - logger.log: "Test starting in 5 seconds..."
      - id(final_target_speed).publish_state(0.0) # Ensure fans are off
      - id(fan_test_status).publish_state("Test Starting...")
      - delay: 5s

      # 2. Test at 100% Speed
      - logger.log: "--- STARTING 100% SPEED TEST ---"
      - script.execute:
          id: _run_test_step
          speed_percent: 100.0
          offset_float: 0.0
          offset_text: "0.0%"
      - script.execute:
          id: _run_test_step
          speed_percent: 100.0
          offset_float: 0.01
          offset_text: "1.0%"
      - script.execute:
          id: _run_test_step
          speed_percent: 100.0
          offset_float: 0.022
          offset_text: "2.2%"
      - script.execute:
          id: _run_test_step
          speed_percent: 100.0
          offset_float: 0.047
          offset_text: "4.7%"
          
      # 3. Test at 50% Speed
      - logger.log: "--- STARTING 50% SPEED TEST ---"
      - script.execute:
          id: _run_test_step
          speed_percent: 50.0
          offset_float: 0.0
          offset_text: "0.0%"
      - script.execute:
          id: _run_test_step
          speed_percent: 50.0
          offset_float: 0.01
          offset_text: "1.0%"
      - script.execute:
          id: _run_test_step
          speed_percent: 50.0
          offset_float: 0.022
          offset_text: "2.2%"
      - script.execute:
          id: _run_test_step
          speed_percent: 50.0
          offset_float: 0.047
          offset_text: "4.7%"

      # 4. Test Complete - Shut down
      - logger.log: "--- TEST COMPLETE ---"
      - id(final_target_speed).publish_state(0.0)
      - lambda: 'id(current_fan_offset) = 0.0f;' # Reset offset to default
      - id(fan_test_status).publish_state("Idle")