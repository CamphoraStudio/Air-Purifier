# Minimalist firmware for testing fan resonance offsets.

esphome:
  on_boot:
    priority: -100.0 # Run after components are set up
    then:
      - lambda: |-
          id(fan_test_status).publish_state("Idle");
          id(final_target_speed).publish_state(0.0);

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf


switch:
  - platform: gpio
    pin: GPIO18
    id: enable_12v
    name: "12V Rail"
    internal: true
    restore_mode: ALWAYS_ON

globals:
  # This global variable will select the test mode:
  # 0 = No Offset (5:0)
  # 1 = 4:1 Split
  # 2 = 3:2 Split
  - id: test_mode
    type: int
    initial_value: '0'

# --- Home Assistant Interface ---
button:
  - platform: template
    name: "Start Fan Test"
    icon: "mdi:play-circle"
    on_press:
      - script.execute: run_fan_test

text_sensor:
  - platform: template
    name: "Fan Test Status"
    id: fan_test_status
    icon: "mdi:clipboard-text-clock"

sensor:
  # Final fan speed target.
  - platform: template
    name: "Final Target Speed"
    id: final_target_speed
    unit_of_measurement: "%"
    icon: "mdi:fan-chevron-up"
    accuracy_decimals: 1
    on_value:
      then:
        # --- THIS IS THE NEW LOGIC ---
        - lambda: |-
            float target_speed_level = x / 100.0f; // e.g., 1.0, 0.5, or 0.0
            
            if (target_speed_level == 0.0f) {
              id(pwm_fan_1).set_level(0.0f);
              id(pwm_fan_2).set_level(0.0f);
              id(pwm_fan_3).set_level(0.0f);
              id(pwm_fan_4).set_level(0.0f);
              id(pwm_fan_5).set_level(0.0f);
            } else {
              // This is the function to map 0.0-1.0 to 0.1-1.0 (10%-100% duty)
              auto calculate_pwm = [&](float speed) {
                return 0.1f + (speed * 0.9f);
              };
              
              int mode = id(test_mode);
              float fan_1_target, fan_2_target, fan_3_target, fan_4_target, fan_5_target;

              // This is the 1% slower speed (e.g., 1.0 -> 0.99, or 0.5 -> 0.49)
              float offset_speed = clamp(target_speed_level - 0.01f, 0.0f, 1.0f);

              if (mode == 1) { // 4:1 Split
                fan_1_target = target_speed_level;
                fan_2_target = target_speed_level;
                fan_3_target = target_speed_level;
                fan_4_target = target_speed_level;
                fan_5_target = offset_speed; // One fan is 1% less
              } else if (mode == 2) { // 3:2 Split
                fan_1_target = target_speed_level;
                fan_2_target = target_speed_level;
                fan_3_target = target_speed_level;
                fan_4_target = offset_speed; // Two fans are 1% less
                fan_5_target = offset_speed;
              } else { // Mode 0 or default: No Offset (5:0)
                fan_1_target = target_speed_level;
                fan_2_target = target_speed_level;
                fan_3_target = target_speed_level;
                fan_4_target = target_speed_level;
                fan_5_target = target_speed_level;
              }

              id(pwm_fan_1).set_level(calculate_pwm(fan_1_target));
              id(pwm_fan_2).set_level(calculate_pwm(fan_2_target));
              id(pwm_fan_3).set_level(calculate_pwm(fan_3_target));
              id(pwm_fan_4).set_level(calculate_pwm(fan_4_target));
              id(pwm_fan_5).set_level(calculate_pwm(fan_5_target));
            }

  # Tachometer Sensor for reading fan RPM.
  - platform: pulse_counter
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
    name: "Fan RPM"
    id: fan_rpm
    update_interval: 2s
    filters:
      - multiply: 0.5 # 2 pulses per revolution
    unit_of_measurement: "RPM"
    icon: "mdi:fan-clock"
    accuracy_decimals: 0

# --- Fan PWM Outputs ---
output:
  - platform: ledc
    pin: GPIO3
    id: pwm_fan_1
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO4
    id: pwm_fan_2
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO5
    id: pwm_fan_3
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO6
    id: pwm_fan_4
    frequency: 25000 Hz
  - platform: ledc
    pin: GPIO7
    id: pwm_fan_5
    frequency: 25000 Hz

# --- Core Test Logic ---
script:
  # Main test sequence script, triggered by the HA button
  - id: run_fan_test
    mode: restart # Allows re-pressing the button to restart the test
    then:
      # 1. Initial 5-second countdown (fans OFF)
      - lambda: |-
          id(final_target_speed).publish_state(0.0);
          id(fan_test_status).publish_state("Test Starting...");
      - delay: 5s

      # --- 2. Test at 100% Speed ---

      # STEP: 100% (Spin-up period)
      - lambda: |-
          id(test_mode) = 0; // Use 'No Offset' for spin-up
          id(fan_test_status).publish_state("Spin-up to 100%...");
          id(final_target_speed).publish_state(100.0);
      - delay: 10s # <-- 10 second spin-up time

      # STEP: 100% | No Offset (5:0)
      - lambda: |-
          id(test_mode) = 0;
          id(fan_test_status).publish_state("100% | No Offset (5:0)");
          id(final_target_speed).publish_state(100.0);
      - delay: 20s # <-- 20 second test time

      # STEP: 100% | 4:1 Split
      - lambda: |-
          id(test_mode) = 1;
          id(fan_test_status).publish_state("100% | 4:1 Split");
          id(final_target_speed).publish_state(100.0);
      - delay: 20s # <-- 20 second test time

      # STEP: 100% | 3:2 Split
      - lambda: |-
          id(test_mode) = 2;
          id(fan_test_status).publish_state("100% | 3:2 Split");
          id(final_target_speed).publish_state(100.0);
      - delay: 20s # <-- 20 second test time

      # --- 3. Test at 50% Speed ---

      # STEP: 50% (Spin-down period)
      - lambda: |-
          id(test_mode) = 0; // Use 'No Offset' for spin-down
          id(fan_test_status).publish_state("Spin-down to 50%...");
          id(final_target_speed).publish_state(50.0);
      - delay: 10s # <-- 10 second spin-down time

      # STEP: 50% | No Offset (5:0)
      - lambda: |-
          id(test_mode) = 0;
          id(fan_test_status).publish_state("50% | No Offset (5:0)");
          id(final_target_speed).publish_state(50.0);
      - delay: 20s # <-- 20 second test time

      # STEP: 50% | 4:1 Split
      - lambda: |-
          id(test_mode) = 1;
          id(fan_test_status).publish_state("50% | 4:1 Split");
          id(final_target_speed).publish_state(50.0);
      - delay: 20s # <-- 20 second test time

      # STEP: 50% | 3:2 Split
      - lambda: |-
          id(test_mode) = 2;
          id(fan_test_status).publish_state("50% | 3:2 Split");
          id(final_target_speed).publish_state(50.0);
      - delay: 20s # <-- 20 second test time

      # --- 4. Test Complete - Shut down ---
      - lambda: |-
          id(final_target_speed).publish_state(0.0);
          id(test_mode) = 0; // Reset mode to default
          id(fan_test_status).publish_state("Idle");